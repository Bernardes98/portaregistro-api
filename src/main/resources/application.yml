spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portaregistro}
    username: ${DB_USER:portaregistro}
    password: ${DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog.xml
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  origin: ${APP_ORIGIN:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:true}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  mail-from: ${MAIL_FROM:noreply@portaregistro.local}
logging:
  structured:
    format:
      console: logstash
